    </div></div></form>`;
    return `${pageHead('长期个人档案','这些信息可随时更新；每次申请会保存独立快照。','<button class="btn primary" onclick="editProfile()">编辑档案</button>')}<div class="profile-summary"><div class="summary-cell"><small>档案完整度</small><strong>${completeness}%</strong><div class="progress" style="margin-top:9px"><span style="width:${completeness}%"></span></div></div><div class="summary-cell"><small>最近更新</small><strong>${p.updatedAt}</strong></div><div class="summary-cell"><small>累计服务</small><strong>168 小时</strong></div><div class="summary-cell"><small>已核验技能</small><strong>2 项</strong></div></div><div class="profile-layout"><nav class="profile-index"><a href="#view-basic">基本信息</a><a href="#view-contact">联系方式</a><a href="#view-education">教育与工作</a><a href="#view-experience">志愿与户外经历</a><a href="#view-skills">技能与证据</a><a href="#view-health">健康与适岗</a><a href="#view-docs">证件材料</a><a href="#view-system">系统沉淀</a></nav><div>
      ${profileSection('view-basic','基本信息','长期维护，报名时自动带入并生成申请快照。',`<div class="profile-view-grid">${detailValue('姓名',p.name)}${detailValue('性别',p.gender)}${detailValue('出生年月',p.birthMonth)}${detailValue('常住城市',p.city)}${detailValue('个人简介',p.intro,true)}</div>`)}
      ${profileSection('view-contact','联系方式与紧急联系人','本人可完整查看；工作人员按角色和业务需要查看。',`<div class="profile-view-grid">${detailValue('手机号',p.phone)}${detailValue('邮箱',p.email)}${detailValue('微信 / 其他联系方式',p.wechat)}${detailValue('常住地址',p.address)}${detailValue('紧急联系人',`${p.emergencyName}（${p.emergencyRelation}）`)}${detailValue('紧急联系人电话',p.emergencyPhone)}</div>`)}
      ${profileSection('view-education','教育与工作','仅保留岗位匹配所需内容。',`<div class="profile-view-grid">${detailValue('最高学历',p.degree)}${detailValue('学校',p.school)}${detailValue('专业',p.major)}${detailValue('毕业时间',p.graduation)}${detailValue('当前单位',p.employer)}${detailValue('职业 / 岗位',p.occupation)}${detailValue('专业背景',p.professional,true)}</div>`)}
      ${profileSection('view-experience','志愿、公益与户外经历','按经历记录参与时间、角色、内容与服务时长。',`<div class="profile-view-grid">${detailValue('志愿 / 公益经历',p.experiences,true)}${detailValue('户外经历',p.outdoor,true)}${detailValue('高海拔经历',p.altitude,true)}</div>`)}
      ${profileSection('view-skills','技能与证据','技能来源和工作人员核验状态会保留。',`<div style="margin-bottom:14px">${p.skills.split('\n').map(tag).join('')}</div><div class="profile-view-grid">${detailValue('证书或证明',p.skillProof,true)}${detailValue('作品链接',p.workLinks,true)}</div>`)}
      ${profileSection('view-health','健康与适岗材料','本人可查看原始信息；工作人员端按权限隔离。',`<div class="profile-view-grid">${detailValue('当前健康状态',p.healthCurrent)}${detailValue('高原经历',p.healthPlateau)}${detailValue('过敏情况',p.allergies)}${detailValue('慢性病 / 特别说明',p.chronic)}${detailValue('长期用药',p.medication)}${detailValue('风险知情确认',p.riskConsent)}${detailValue('工作限制或注意事项',p.limits,true)}${detailValue('健康材料',p.healthMaterial)}${detailValue('适岗结论',p.healthConclusion)}</div>`)}
      ${profileSection('view-docs','证件与资格材料','敏感字段在工作人员端默认脱敏，原始附件需专项授权。',`<div class="profile-view-grid">${detailValue('证件类型',p.idType)}${detailValue('证件号码',p.idNumberMasked)}${detailValue('有效期',p.idExpiry)}${detailValue('身份证明附件',p.idFile)}${detailValue('驾驶 / 专业资格',p.license)}${detailValue('其他证明',p.otherDocs)}</div>`)}
      ${profileSection('view-system','系统沉淀（不可自行修改）','由报名、审核和服务过程自动形成。',`<div class="record-list"><div class="record-row"><b>历次报名与结果</b><p>保留面试、录取、候补和未录取记录。</p></div><div class="record-row"><b>项目与站点服务记录</b><p>累计服务 168 小时，完成 3 个服务期，参与 2 个项目。</p></div><div class="record-row"><b>工作人员核验与评价</b><p>2 项技能已核验；最近一次站点评价为“表现优秀”。</p></div></div>`)}
    </div></div>`
  }
  function volMessages(){const list=state.appSubmitted?[['申请提交成功','我们已收到你的 2026年10月招募申请，当前进入资格预审。','刚刚',true]]:[['健康材料补件提醒','请在 9月20日 18:00 前补充必要健康材料。','今天 15:20',true],['面试安排已确认','你的在线面试时间为 9月17日 14:00，请提前 10 分钟进入。','9月15日',true],['资格预审通过','你的申请已通过资格预审，进入初选环节。','9月14日',false],['申请提交成功','我们已收到你的 2026年10月招募申请。','9月12日',false]];return `${pageHead('消息中心','站内信是流程通知的权威记录。','<button class="btn" onclick="toast(\'全部消息已标记为已读\')">全部标为已读</button>')}<div class="message-list">${list.map(x=>`<article class="message ${x[3]?'unread':''}"><div class="message-icon">信</div><div class="message-body"><b>${x[0]} ${x[3]?tag('未读'):''}</b><p>${x[1]}</p></div><time>${x[2]}</time></article>`).join('')}</div>`}
  document.addEventListener('click',event=>{const link=event.target.closest('[data-mode]');if(link)switchMode(link.dataset.mode)});
  window.addEventListener('hashchange',syncModeFromHash);
  render();
</script>
</body>
</html>
